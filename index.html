<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GitHub Issues Tracker </title>


    <!-- icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">


    <!-- tailwind+DaisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!--google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font-awesome cdn icons  link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body class="min-h-screen max-w-md bg-white shadow-2xl pt-32 mx-auto">
    <div class="logo w-[100px] mx-auto">
        <img src="./assets/github-logo.png" alt="">
    </div>
    <div class="">
        <h2 class="font-bold text-2xl text-center mt-3">GitHub Issues Tracker</h2>
        <p class="opacity-50 text-center">Sign in to manage your issues</p>
    </div>
    <div class="form pt-10">
        <div class="card bg-base-100 w-full max-w-sm mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label text-neutral font-bold">Username</label>
                    <input id="input-username" maxlength="" minlength="" type="text"
                        class="input rounded-md bg-base-200" value="" placeholder="Enter Username" />
                    <br>
                    <label class="label text-neutral font-bold ">Password</label>
                    <input id="input-password" maxlength="4" minlength="4" type="password"
                        class="input rounded-md bg-base-200" placeholder="Enter Password" />
                    <div></div>
                    <button id="Signin-btn" class="btn btn-primary mt-4 rounded-md">Sign In</button>
                </fieldset>
            </div>
        </div>
    </div>
    <script src=""></script>
</body>


</html>
