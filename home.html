<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GitHub Issues Tracker | HOME </title>


    <!-- icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">


    <!-- tailwind+DaisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!--google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font-awesome cdn icons  link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="navbar bg-base-100 shadow-sm ">
                <div class="flex justify-between items-center w-full ">
                    <div class="flex items-center ">
                        <img src="./assets/github-logo.png" alt="" class="w-12">
                        <a class="btn btn-ghost text-2xl">GitHub Issues Tracker</a>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
                        <div class="">
                            <button class="btn btn-primary">+ New Issue</button>
                        </div>
                    </div>
                </div>
            </div>

        </nav>
    </header>
    <main class="w-[80%] mx-auto bg-base-100 shadow-sm">

        <div class="mt-6 mb-3 bg-base-100 shadow-sm h-[70px] pt-3.5 pl-2">
            <button onclick="switchTab('all')" id="btn-all" class="btn btn-primary">All</button>
            <button onclick="switchTab('open')" id="btn-open" class="btn btn-primary">Open</button>
            <button onclick="switchTab('close')" id="btn-close" class="btn btn-primary">Close</button>
            <!-- <button onclick="toggleStyle('open-btn')" class="bg-white rounded-md px-8 py-2 shadow-2xl ml-2 mr-2 border"
                id="open-btn">Open</button>
            <button onclick="toggleStyle('close-btn')" class="bg-white rounded-md px-8 py-2 shadow-2xl border"
                id="close-btn">Close</button> -->
        </div>

        <div>
            <div class="flex gap-2 justify-between bg-base-100 shadow-sm h-[70px] p-3 ">
                <div class="flex gap-2">
                    <img src="./assets/Aperture.png" alt="">
                    <div>
                        <p id="count" class="font-bold">50 Issues</p>
                        <p class="opacity-50 w-3xl">Track and manage your project issues</p>
                    </div>
                </div>

                <div class="flex gap-3">
                    <div class=" flex items-center gap-2">
                        <div><img src="./assets/Ellipse 2(green).png" alt=""></div>
                        <p>Open</p>
                    </div>
                    <div class=" flex items-center gap-2">
                        <div><img src="./assets/Ellipse 1(purple).png" alt=""></div>
                        <p>Close</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="issue-container" class=" grid grid-cols-4 m-6 gap-4">



        </div>


        <!-- show loading spinner -->
        <div id="load-spinner" class="h-[90vh] hidden justify-center items-center">
            <span class="loading loading-spinner loading-xl"></span>
        </div>



    </main>
    <!-- <script src="./script/script_all.js"></script> -->
    <script src="./script/Load_script.js"></script>
</body>

</html>
