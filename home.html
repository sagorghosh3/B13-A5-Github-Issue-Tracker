<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GitHub Issues Tracker | HOME </title>


    <!-- icon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">


    <!-- tailwind+DaisyUi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!--google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- font-awesome cdn icons  link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />


    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="navbar bg-base-100 shadow-sm ">
                <div class="flex justify-between items-center w-full ">
                    <div class="flex items-center ">
                        <img src="./assets/github-logo.png" alt="" class="w-12">
                        <a class="btn btn-ghost text-2xl">GitHub Issues Tracker</a>
                    </div>
                    <!-- search original  -->
                    <!-- <div ">
                        <input type="text" placeholder="Search" class="input input-bordered w-24 md:w-auto" />
                    </div> -->
                    <div class="flex gap-2">
                        <input id="searchInput" type="text" placeholder="Search issues..."
                            class="input input-bordered w-64" />
                        <button class="btn btn-primary">+ New Issue</button>
                    </div>
                </div>
            </div>

        </nav>
    </header>
    <main class="w-[80%] mx-auto bg-base-100 shadow-sm">

        <!-- <div class="mt-6 mb-3 bg-base-100 shadow-sm h-[70px] pt-3.5 pl-2">
            <button onclick="switchTab('all')" id="btn-all" class="btn btn-primary">All</button>
            <button onclick="switchTab('open')" id="btn-open" class="btn ">Open</button>
            <button onclick="switchTab('close')" id="btn-close" class="btn ">Close</button> -->
        <!-- <button onclick="toggleStyle('open-btn')" class="bg-white rounded-md px-8 py-2 shadow-2xl ml-2 mr-2 border"
                id="open-btn">Open</button>
            <button onclick="toggleStyle('close-btn')" class="bg-white rounded-md px-8 py-2 shadow-2xl border"
                id="close-btn">Close</button> -->
        <!-- </div> -->


        <!-- alternative btn -->
        <button id="btn-all" onclick="switchTab('all')" class="btn btn-primary">
            All (<span id="count-all"></span>)
        </button>

        <button id="btn-open" onclick="switchTab('open')" class="btn">
            Open (<span id="count-open"></span>)
        </button>

        <button id="btn-closed" onclick="switchTab('closed')" class="btn">
            Closed (<span id="count-closed"></span>)
        </button>

        <div>
            <div class="flex gap-2 justify-between bg-base-100 shadow-sm h-[70px] p-3 ">
                <div class="flex gap-2">
                    <img src="./assets/Aperture.png" alt="">
                    <div>
                        <p id="count" class="font-bold">50 Issues</p>
                        <p class="opacity-50 w-3xl">Track and manage your project issues</p>
                    </div>
                </div>

                <div class="flex gap-3">
                    <div class=" flex items-center gap-2">
                        <div><img src="./assets/Ellipse 2(green).png" alt=""></div>
                        <p>Open</p>
                    </div>
                    <div class=" flex items-center gap-2">
                        <div><img src="./assets/Ellipse 1(purple).png" alt=""></div>
                        <p>Close</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- <div id="issue-container" class=" grid grid-cols-4 m-6 gap-4">
            


        </div> -->
        <!-- alternative -->
        <div id="issue-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        </div>
        <div id="open-container" class="hidden grid grid-cols-4 m-6 gap-4">
            <h2 class="text-4xl">open coming</h2>
        </div>


        <div id="close-container" class="hidden grid grid-cols-4 m-6 gap-4">
            <h2 class="text-4xl">close coming</h2>


        </div>




        <!-- show loading spinner -->
        <div id="load-spinner" class="hidden text-center py-10">
            <span class="loading loading-spinner loading-lg"></span>
        </div>

        <!-- modal -->
        <dialog id="issue_modal" class="modal">

            <div class="modal-box max-w-2xl">

                <!-- TITLE -->
                <h3 id="modal_title" class="text-2xl font-bold mb-3"></h3>

                <!-- STATUS + AUTHOR + DATE -->
                <div class="flex items-center gap-3 text-sm mb-4">

                    <span id="modal_status" class="badge badge-success text-white px-3 py-1">
                    </span>

                    <span class="opacity-70">
                        • Opened by <span id="modal_author"></span>
                    </span>

                    <span class="opacity-70">
                        • <span id="modal_date"></span>
                    </span>

                </div>

                <!-- LABELS -->
                <div class="flex gap-2 mb-4">

                    <span id="modal_label" class="badge badge-outline badge-error">
                    </span>

                </div>

                <!-- DESCRIPTION -->
                <p id="modal_desc" class="opacity-80 mb-6"></p>

                <!-- ASSIGNEE + PRIORITY BOX -->
                <div class="bg-base-200 rounded-lg p-4 flex justify-between">

                    <div>
                        <p class="text-sm opacity-60">Assignee:</p>
                        <p id="modal_assignee" class="font-semibold"></p>
                    </div>

                    <div>
                        <p class="text-sm opacity-60">Priority:</p>
                        <span id="modal_priority" class="badge badge-error text-white px-3 py-1">
                        </span>
                    </div>

                </div>

                <!-- BUTTON -->
                <div class="modal-action">

                    <form method="dialog">
                        <button class="btn btn-primary">Close</button>
                    </form>

                </div>

            </div>

        </dialog>



    </main>
    <script src="./script/test.js"></script>
    <!-- <script src="./script/Load_script.js"></script> -->
</body>

</html>
